<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="CPEL">
<meta name="theme-color" content="#234240">
<!-- Solo tema claro: evita que el modo oscuro automático de Chrome/Samsung Internet en Android recoloree el sitio. -->
<meta name="color-scheme" content="only light">
<title>CPEL — Portal</title>
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="icon" href="assets/img/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/css/landing.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar__mark"></div>
    <div class="topbar__title">PROYECTOS</div>
    <div class="brand-strip_t">
      <img src="assets/img/logo-cpel.png" alt="CPEL" class="brand-strip_t__logo brand-strip_t__logo--cpel">
    </div>
    <!-- Fecha, hora y clima de la CDMX (clima-cdmx.js) -->
    <div class="cdmx" id="cdmx" hidden>
      <div class="cdmx__fila">
        <time class="cdmx__hora" id="cdmxHora"></time>
        <span class="cdmx__clima" id="cdmxClima" hidden></span>
      </div>
      <div class="cdmx__fila cdmx__fila--sub">
        <span id="cdmxFecha"></span><span class="cdmx__lugar">CDMX</span>
      </div>
    </div>
    <!-- Solo se muestra cuando el sitio está protegido con contraseña en
         Cloudflare Pages (ver functions/_middleware.js y landing.js). -->
    <a class="topbar__logout" id="logoutLink" href="/__logout" hidden>Salir</a>
  </header>

  <main class="main">
    <div class="hero">
      <h1 class="hero__title">Portal de Seguimiento</h1>
      <!-- <p class="hero__subtitle"><i>Elige una sección para continuar</i></p> -->
    </div>

    <div class="nav-grid">
      <a class="nav-card" href="cartera-mixtos/index.html" style="--i:0">
        <div class="nav-card__icon nav-card__icon--mixtos" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><circle cx="6.5" cy="6.5" r="2.6" fill="currentColor"/><path d="M6.5 1.4v1.2M6.5 10.4v1.2M1.4 6.5h1.2M10.4 6.5h1.2M2.9 2.9l.85.85M9.25 9.25l.85.85M2.9 10.1l.85-.85M9.25 3.75l.85-.85" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M16 11.2V22.5M14 22.5h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M16 11.2L16.7 3.6c.05-.6-.75-.8-.95-.25L14.6 6.9M16 11.2l6.6 3.6c.5.3 1.05-.3.65-.75l-2.95-2.7M16 11.2l-6.9 3.3c-.55.25-.35 1.05.25 1l3.9-.35" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="11.2" r="1.2" fill="currentColor"/></svg>
        </div>
        <div class="nav-card__body">
          <div class="nav-card__title">Mixtos</div>
          <div class="nav-card__desc"><i>Ficha por proyecto, mapa geoespacial y seguimiento</i></div>
        </div>
        <svg class="nav-card__arrow" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a class="nav-card" href="cartera-cpel/index.html" style="--i:1">
        <div class="nav-card__icon nav-card__icon--cartera" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M1.5 20.5L7.5 6l4 6.5M22.5 20.5L16.5 6l-4 6.5" fill="currentColor" opacity=".45"/><path d="M6.8 9.5q1.3-1 2.6 0t2.6 0t2.6 0t2.6 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M5 12.2Q12 15.6 19 12.2L18 20.5H6z" fill="currentColor"/><path d="M9.5 16.5v2.5M12 17v2.5M14.5 16.5v2.5" stroke="#1d55a8" stroke-width="1.4" stroke-linecap="round"/><path d="M1.5 20.5h21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <div class="nav-card__body">
          <div class="nav-card__title">Cartera CPEL</div>
          <div class="nav-card__desc"><i>Avance programado vs. real, hitos, ficha técnica y plazos</i></div>
        </div>
        <svg class="nav-card__arrow" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <!-- OCULTO hasta liberar Cartera Anteproyectos (la página ya funciona en
           /cartera-anteproyectos/). Para mostrar la tarjeta, quita el
           <template> que la envuelve. -->
      <template id="accesoAnteproyectos">
      <a class="nav-card" href="cartera-anteproyectos/index.html" style="--i:2">
        <!-- Plano con escuadra: proyectos aún en anteproyecto -->
        <div class="nav-card__icon nav-card__icon--anteproyectos" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="3.5" width="19" height="15" rx="1.5" fill="currentColor" opacity=".22"/><rect x="2.5" y="3.5" width="19" height="15" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 8.5h19M2.5 13.5h19M7.5 3.5v15M12.5 3.5v15M17.5 3.5v15" stroke="currentColor" stroke-width=".7" opacity=".55"/><path d="M5.5 15.5l5-7.5 4 5 3-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 22.5l7.5-7.5v7.5z" fill="currentColor"/><path d="M17 22.5l1.5-1.5" stroke="#1a7a5c" stroke-width="1"/></svg>
        </div>
        <div class="nav-card__body">
          <div class="nav-card__title">Cartera Anteproyectos</div>
          <div class="nav-card__desc"><i>Descripción técnica, red de transmisión, avance y ficha técnica</i></div>
        </div>
        <svg class="nav-card__arrow" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      </template>
    </div>
  
    <section class="semana" id="semana" aria-labelledby="semanaTitulo" hidden>
      <h2 class="section-title section-title--actualizaciones" id="semanaTitulo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12a8 8 0 01-13.7 5.6M4 12a8 8 0 0113.7-5.6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M18 3v3.8h-3.8M6 21v-3.8h3.8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        ÚLTIMAS ACTUALIZACIONES
      </h2>
      <div class="semana__tarjetas">
        <article class="semana-card" id="semanaMixtos" hidden></article>
        <article class="semana-card" id="semanaCartera" hidden></article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <button type="button" class="site-footer__btn" id="siteFooter" aria-haspopup="dialog" aria-controls="sheetColaboradores">
      <span class="brand-strip_t">
        <img src="assets/img/logo-cfe.png" alt="CFE" class="brand-strip_t__logo brand-strip_t__logo--cfe">
      </span>
      <span class="site-footer__text">© Gerencia de Construcción // Subgerencia Técnica de Construcción</span>
    </button>
  </footer>

  <!-- Colaboradores: se despliega al hacer clic en el footer. Los nombres
       vienen de data/colaboradores.json (ver landing.js) -->
  <div class="sheet sheet--portal" id="sheetColaboradores" aria-hidden="true">
    <div class="sheet__scrim" data-close-sheet></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetColaboradoresTitle">
      <div class="sheet__head">
        <div class="sheet__title" id="sheetColaboradoresTitle">Colaboradores</div>
        <button class="sheet__close" data-close-sheet aria-label="Cerrar">&times;</button>
      </div>
      <div class="sheet__body">
        <ul class="colaboradores-list" id="colaboradoresList"></ul>
      </div>
    </div>
  </div>

  <script src="assets/js/shared/text-utils.js"></script>
  <script src="assets/js/shared/dialog.js"></script>
  <script src="assets/js/shared/pwa.js"></script>
  <script src="assets/js/landing.js"></script>
  <script src="assets/js/clima-cdmx.js"></script>
  <script src="assets/js/semana-resumen.js"></script>
  <script src="assets/js/semana-portal.js"></script>
</body>
</html>
